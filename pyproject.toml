[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jkg"
version = "8.1.0"
description = "Local-first, five-layer memory with graph, full-text, vector, and temporal retrieval."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Altynai & Jessica"}]
keywords = ["ai", "memory", "knowledge-graph", "embeddings", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.9",
    "requests>=2.28",
    "numpy>=1.24",
    "sentence-transformers>=3,<6",
]

[project.urls]
Homepage = "https://github.com/altyshalu/jessica-knowledge-graph"
Documentation = "https://github.com/altyshalu/jessica-knowledge-graph#readme"
Issues = "https://github.com/altyshalu/jessica-knowledge-graph/issues"
Source = "https://github.com/altyshalu/jessica-knowledge-graph"

[project.scripts]
jkg = "jkg.memory:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["jkg*"]
