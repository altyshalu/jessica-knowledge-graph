[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jkg"
version = "7.1.0"
description = "JKG 7.1 — Unified Memory Fabric: semantic, profile, factual, episodic, and procedural memory in one SQLite database."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Altynai & Jessica"}]
keywords = ["ai", "memory", "knowledge-graph", "embeddings", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.9",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.scripts]
jkg = "jkg.memory:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["jkg*"]
